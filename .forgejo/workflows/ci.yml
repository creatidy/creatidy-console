name: Development Checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified upstream
        with:
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: https://github.com/actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified upstream
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pinned npm
        run:
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: make install
      - name: Run authoritative checks
        run: make check
